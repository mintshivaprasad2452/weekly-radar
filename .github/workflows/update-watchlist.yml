name: Weekly Watchlist Pipeline

on:
  schedule:
    # Runs every Saturday at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * 6'
  workflow_dispatch:
    inputs:
      scan_date:
        description: 'Optional scan date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python3 process_scan.py test

      - name: Process Scan and Compile Portal
        run: |
          python3 process_scan.py

      - name: Commit and Push Updates to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ index.html netlify.toml
          git diff-index --quiet HEAD || (git commit -m "Auto-update: Weekly scan intelligence & portal refresh [skip ci]" && git push)
